name: Extraction checks

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.14.1'
      - run: terraform -chdir=infra fmt -check -recursive
      - run: terraform -chdir=infra init -backend=false -input=false -lockfile=readonly
      - run: terraform -chdir=infra validate
      - run: terraform -chdir=infra test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tools -p test_azure_preflight.py
      - run: python -m unittest discover -s tools -p test_deployment.py
  static-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/browser/package-lock.json
      - run: python -m pip install -r services/discovery/requirements-dev.txt
      - run: npm ci --prefix tools/browser
      - run: node tools/browser/check_api.cjs
      - run: npx --prefix tools/browser playwright install --with-deps chromium
      - run: python tools/check_static_ui.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-ui-browser-captures
          path: tools/browser/artifacts/
  monolith:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python manage.py test --noinput
      - run: python tools/check_split_import.py

  discovery:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/discovery
    env:
      DJANGO_SECRET_KEY: ci-only-disposable-key-never-used-in-deployment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/discovery/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check --select E9,F63,F7,F82 .
      - run: python -m openapi_spec_validator openapi.json
      - run: python manage.py makemigrations --check --dry-run
      - run: python -m coverage run --source=discovery,accounts,notifications,config --omit='*/migrations/*,*/test*.py' manage.py test discovery config --noinput
      - run: python -m coverage report --fail-under=70

  groups:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/groups
    env:
      DJANGO_SECRET_KEY: ci-only-disposable-key-never-used-in-deployment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/groups/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check --select E9,F63,F7,F82 . ../../tools/check_service_boundary.py
      - run: python -m openapi_spec_validator openapi.json
      - run: python manage.py makemigrations --check --dry-run
      - run: python -m coverage run --source=groups,notifications,config --omit='*/migrations/*,*/test*.py' manage.py test config --noinput
      - run: python -m coverage report --fail-under=70
      - run: python ../../tools/check_service_boundary.py

  compose-sqlserver:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: docker compose config --quiet
      - run: python tools/check_compose.py --project bassline-ci-${{ github.run_id }}-${{ github.run_attempt }}
